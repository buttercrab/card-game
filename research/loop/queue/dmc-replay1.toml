# Replay ratio 1 (DMC v1: 2).
id = "dmc-replay1"
hypothesis = """Training on each decision once on average (DMC v1: twice) uses fresher data; if the actors, not the learner, limit DMC v1, the rating is the same at less GPU time."""
method = "dmc"
tags = ["hparam"]
parent = "dmc-v1-score"
priority = 35
seeds = [20261005]

[budget]
wall_hours = 20.0
train_hours = 5.25
hands = 20000000
gpu = true

# Training holds 12 of the Mac's threads; the suite runs on the home
# server, so the GPU can take the next run meanwhile.
[resources]
host = "mac"
threads = 12
eval_host = "home"
eval_threads = 6

[evals]
curve = true
suite = "v1"
parts = ["ladder", "presets", "heldout", "puzzles"]
baselines = ["hard"]
cost = true

[config]
base = "research/loop/configs/dmc-v1.toml"

[config.set]
"buffer.replay_ratio" = 1.0
