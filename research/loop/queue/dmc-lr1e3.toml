# Learning rate 1e-3 (DMC v1: 3e-4).
id = "dmc-lr1e3"
hypothesis = """A learning rate of 1e-3 (DMC v1: 3e-4) learns faster per hand in the first million hands and may end higher within the same 5.25 hours, if the Monte Carlo targets' noise does not make it unstable."""
method = "dmc"
tags = ["hparam"]
parent = "dmc-v1-score"
priority = 55
seeds = [20261005]

[budget]
wall_hours = 20.0
train_hours = 5.25
hands = 20000000
gpu = true

# Training holds 12 of the Mac's threads; the suite runs on the home
# server, so the GPU can take the next run meanwhile.
[resources]
host = "mac"
threads = 12
eval_host = "home"
eval_threads = 6

[evals]
curve = true
suite = "v1"
parts = ["ladder", "presets", "heldout", "puzzles"]
baselines = ["hard"]
cost = true

[config]
base = "research/loop/configs/dmc-v1.toml"

[config.set]
"optim.lr" = 0.001
