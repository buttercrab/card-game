# Width 256 (about four times the parameters).
id = "dmc-wide"
hypothesis = """A trunk of width 256 (about four times DMC v1's 0.6M parameters) fits the value of more situations; at a fixed 5.25 hours it plays fewer hands (slower actors), so this measures whether size or hands limit DMC v1 (the scaling study's first point above it)."""
method = "dmc"
tags = ["scaling"]
parent = "dmc-v1-score"
priority = 45
seeds = [20261005]

[budget]
wall_hours = 20.0
train_hours = 5.25
hands = 20000000
gpu = true

# Training holds 12 of the Mac's threads; the suite runs on the home
# server, so the GPU can take the next run meanwhile.
[resources]
host = "mac"
threads = 12
eval_host = "home"
eval_threads = 6

[evals]
curve = true
suite = "v1"
parts = ["ladder", "presets", "heldout", "puzzles"]
baselines = ["hard"]
cost = true

[config]
base = "research/loop/configs/dmc-v1.toml"

[config.set]
"model.trunk.width" = 256
"model.trunk.feedforward" = 512
"model.head_width" = 512
