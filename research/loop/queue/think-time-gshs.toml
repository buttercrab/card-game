# The owner's think-time question (2026-10-05), on 경기과고 (scoring G:
# `scoring.lose = PaysBack(10)`, as the preset is at the run's commit).
# Today the table's 고수 moves in about 1.6 s, 80% of it searching on every
# thread with samples capped at 5000 a thread: about 1.3 s of search. Does
# about 2.4 s of search (a 3 s move) make it measurably stronger?
#
# Both bots think on a clock, so the run measures the home server itself
# and does NOT reproduce bit for bit (eval records it as not
# reproducible). One deal at a time (deal_threads = 1), each search on all
# 12 threads, as the table thinks; the step holds the home server's loop
# share alone, at nice 15 beside the live worker.
#
# Size: the deal-by-deal difference has a standard deviation of about 10
# points a seat-hand (P3's paired runs: ±0.30 at 4 500 deals), so 2 250
# deals give about ±0.43 here and, pooled with think-time-default, about
# ±0.3. About 10 decisions a deal for the measured seat at 1.3 s + 2.4 s,
# plus the 고수 field: roughly 28 hours.
id = "think-time-gshs"
hypothesis = """A longer think budget makes 고수 measurably stronger: searching about 2.4 s a decision instead of about 1.3 s (samples capped at 5000 a thread, all 12 threads) gains points per seat-hand on 경기과고, deal by deal against the 1.3 s bot on the same deals with seats rotated. It decides whether the table's pace for 고수 should go up."""
method = "search-tuning"
tags = ["search", "hparam"]
parent = "bot:search:60000:1:1300@threads=12"
priority = 90
seeds = [1]

[budget]
wall_hours = 40.0
gpu = false

[resources]
host = "home"
threads = 12
eval_host = "home"
eval_threads = 12

[evals]
curve = false
suite = "think-gshs"
parts = ["matches"]
baselines = ["parent"]
cost = false

[options]
bot = "search:60000:1:2400@threads=12"
clock = true
deal_threads = 1
