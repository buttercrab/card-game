# Reward scale 1/80 (DMC v1: 1/40).
id = "dmc-reward-half"
hypothesis = """Targets at points/80 (DMC v1: points/40) halve the loss's scale; with Adam this mainly changes what the exploration temperature means in points, so a rating change here is about exploration, not optimisation."""
method = "dmc"
tags = ["ablation"]
parent = "dmc-v1-score"
priority = 20
seeds = [20261005]

[budget]
wall_hours = 20.0
train_hours = 5.25
hands = 20000000
gpu = true

# Training holds 12 of the Mac's threads; the suite runs on the home
# server, so the GPU can take the next run meanwhile.
[resources]
host = "mac"
threads = 12
eval_host = "home"
eval_threads = 6

[evals]
curve = true
suite = "v1"
parts = ["ladder", "presets", "heldout", "puzzles"]
baselines = ["hard"]
cost = true

[config]
base = "research/loop/configs/dmc-v1.toml"

[config.set]
reward_scale = 0.0125
