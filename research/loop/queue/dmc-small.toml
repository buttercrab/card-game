# Width 64 (about a quarter of the parameters).
id = "dmc-small"
hypothesis = """A trunk of width 64 (about a quarter of DMC v1's parameters) plays more hands in the same time; if it rates close to DMC v1, hands matter more than size at this budget (a scaling point below v1)."""
method = "dmc"
tags = ["scaling"]
parent = "dmc-v1-score"
priority = 25
seeds = [20261005]

[budget]
wall_hours = 20.0
train_hours = 5.25
hands = 20000000
gpu = true

# Training holds 12 of the Mac's threads; the suite runs on the home
# server, so the GPU can take the next run meanwhile.
[resources]
host = "mac"
threads = 12
eval_host = "home"
eval_threads = 6

[evals]
curve = true
suite = "v1"
parts = ["ladder", "presets", "heldout", "puzzles"]
baselines = ["hard"]
cost = true

[config]
base = "research/loop/configs/dmc-v1.toml"

[config.set]
"model.trunk.width" = 64
"model.trunk.feedforward" = 128
"model.head_width" = 128
