# Belief v1, large: belief v1's run with about four times the parameters,
# on the same data and split, to see whether size is what v1 lacks.
#
#   cd ml && nice -n 10 uv run python -m cardgame_ml.train \
#       --config ../research/experiments/2026-10-05-belief-v1-large/config.toml

name = "belief-v1-large"
dataset = "selfplay/selfplay-v1"
seed = 20261005
eval_every = 2000
device = "auto"

# The same validation games as belief v1.
[split]
val_fraction = 0.05
seed = 1

# About 2.5M parameters.
[model]
width = 192
heads = 6
layers = 6
feedforward = 512
dropout = 0.1

[optim]
batch_size = 512
epochs = 12
lr = 0.0007
weight_decay = 0.05
warmup_steps = 500
min_lr_ratio = 0.05
grad_clip = 1.0
