[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
engine = { path = "crates/engine" }
mighty = { path = "crates/mighty" }
env = { path = "crates/env" }
infer = { path = "crates/infer" }
server = { path = "crates/server" }
sim = { path = "crates/sim" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Unoptimised deflate is far too slow for the tests that write shards.
[profile.dev.package.zlib-rs]
opt-level = 3
