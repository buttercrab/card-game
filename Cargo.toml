[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
engine = { path = "crates/engine" }
mighty = { path = "crates/mighty" }
env = { path = "crates/env" }
infer = { path = "crates/infer" }
server = { path = "crates/server" }
sim = { path = "crates/sim" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests play thousands of hands and search deeply: unoptimised they spend
# most of their time in the engine. A light optimisation of the workspace
# and a full one of the dependencies (built once and cached) make the test
# binaries several times faster for a little more compile time.
[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
