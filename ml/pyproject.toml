[project]
name = "cardgame-ml"
version = "0.1.0"
description = "Training, export and scaling studies for the card-game bots"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["cardgame-env", "numpy>=2.3"]

[project.optional-dependencies]
# Training and ONNX export: `uv sync --extra torch` (MPS on the Mac). On
# Linux it comes from PyTorch's CPU-only index, which keeps CI light.
torch = ["torch>=2.8", "onnx>=1.19", "onnxscript>=0.5"]

[tool.uv.sources]
# The Rust environment's bindings (crates/env-py), built by maturin on
# `uv sync`; that needs a Rust toolchain.
cardgame-env = { path = "../crates/env-py" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "PL"]

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal values by design.
"tests/**" = ["PLR2004"]

[tool.pyright]
include = ["src", "tests", "../crates/env-py/python"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
