name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables keep backtraces readable for a fraction of the link time
  # (most of a Windows or macOS test build).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Pull requests that touch only docs or research notes skip the heavy jobs.
# A job's `if` (or, for the test matrix, each step's) skips it, so it still
# reports success and the required checks never wait on a job that did not
# run. Pushes to main run everything, and so does a failed `changes`.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.files.outputs.rust }}
      ml: ${{ steps.files.outputs.ml }}
      web: ${{ steps.files.outputs.web }}
      e2e: ${{ steps.files.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pull request's merge commit and the base it merges into.
          fetch-depth: 2
      - id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | tee /dev/stderr | bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"
          else
            printf 'rust=true\nml=true\nweb=true\ne2e=true\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The web client's types and catalog are generated from the server's;
      # a change to either must come with the regenerated files.
      - name: Generated web files are current
        run: |
          cargo run -p server -- --write-generated web/src/lib/generated
          git add -N web/src/lib/generated
          git diff --exit-code -- web/src/lib/generated
      # The oldest Rust the workspace says it builds with (`rust-version`).
      - name: Check the minimum supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --workspace --all-targets --locked

  # Every shell script through shellcheck, and the deploy scripts against
  # stand-ins for docker, ssh, curl and gh. Cheap, so it always runs.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/shellcheck.sh
      - run: bash deploy/test/run.sh

  # Skipped step by step rather than with a job `if`: a skipped matrix job
  # reports one `test` check instead of the three required ones.
  test:
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - if: env.RUN == 'true'
        run: cargo test --workspace

  simulate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Play every preset with every bot mix
        run: |
          for bots in random simple mixed; do
            cargo run --release -p sim -- --games 2000 --bots "$bots"
          done
          # The search bot is slow; a few games still catch illegal moves.
          cargo run --release -p sim -- --games 30 --bots search

  # A few deals of every part of eval suite v1, so the suite and the runner
  # keep working together. Too small to measure anything.
  eval:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo run --release -p eval -- run --suite v1 --bot hard --quick --out target/eval-quick
      - run: cat target/eval-quick/report.md >> "$GITHUB_STEP_SUMMARY"

  # Lint, types and tests for the Python side, the environment's bindings
  # (crates/env-py) included: `uv sync` builds them with maturin, and the
  # tests replay positions the Rust side recorded. The torch extra comes
  # from PyTorch's CPU-only index on Linux, so the models type-check and
  # their tests (tiny, on CPU) run here too.
  ml:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ml == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - run: uv sync --locked --extra torch
      - run: uv run ruff check . ../crates/env-py/python
      - run: uv run ruff format --check . ../crates/env-py/python
      - run: uv run pyright
      # For the one test that runs the real `eval check-bot` (the others
      # stub it); it is skipped when no eval is built.
      - run: cargo build -p eval
      - run: uv run pytest

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx svelte-check --tsconfig ./tsconfig.json --threshold warning
      # Unit tests (vitest); the scoring test reads crates/mighty/tests/payoffs.json.
      - run: npm test

  # Every page and /preview state at four sizes, light and dark, served by
  # the real server (web/e2e). Known layout bugs are marked expected-fail
  # until docs/FIXES.md 1.8 fixes them.
  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
