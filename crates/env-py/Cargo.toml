[package]
name = "env-py"
description = "Python bindings for the RL environment and the self-play generator (PyO3, built with maturin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# The extension module `cardgame_env._core`; the Python package around it
# is in `python/`.
name = "_core"
crate-type = ["cdylib"]
# Tested from Python (ml/tests): a test harness would need libpython.
test = false
doctest = false

[dependencies]
engine.workspace = true
engine-ml.workspace = true
env.workspace = true
mighty.workspace = true
numpy = "0.29"
# One wheel for every CPython from 3.10 on; the oldest also lets `cargo
# build --workspace` use whatever Python a machine has (ml/ needs 3.13).
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json.workspace = true

[lints]
workspace = true
