# Runs the card game behind the homelab's Traefik (network traefik-proxy),
# which the Cloudflare tunnel reaches. Started by deploy/update.sh.
name: card-game

services:
  cards:
    build: ..
    image: card-game:latest
    container_name: card-game
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      RUST_LOG: info
    volumes:
      - tables:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      traefik-proxy:
        aliases:
          - cards-origin

  # Thinks for the bots of the Seoul server (cards.buttercrab.io), which is
  # too small to search deeply. It dials out, so no port is opened here.
  # The shared secret lives outside the repository.
  bots:
    image: card-game:latest
    container_name: card-game-bots
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["--bot-worker", "wss://cards.buttercrab.io/internal/bots"]
    env_file: ${HOME}/.config/card-game/bots.env
    environment:
      RUST_LOG: info
    # It serves nothing, so "healthy" only means the binary runs.
    healthcheck:
      test: ["CMD", "server", "--help"]
      interval: 1m
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  traefik-proxy:
    external: true

volumes:
  tables:
