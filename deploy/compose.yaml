# The home server's part of the card game: it builds the image (the Seoul
# instance is too small to compile Rust) and thinks for the Seoul server's
# bots. Players only ever reach Seoul (cards.buttercrab.io). Started by
# deploy/update.sh.
name: card-game

services:
  # Thinks for the bots of the Seoul server (cards.buttercrab.io), which is
  # too small to search deeply. It dials out, so no port is opened here.
  # The shared secret lives outside the repository.
  bots:
    build:
      context: ..
      args:
        # Set by deploy/update.sh; the server reports it at /version.
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: card-game:latest
    container_name: card-game-bots
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["--bot-worker", "wss://cards.buttercrab.io/internal/bots", "--worker-alive", "/tmp/alive"]
    # Where it keeps its liveness file; the rest of the container is read-only.
    tmpfs:
      - /tmp
    # Searches use every core but little memory; cap it anyway so a leak
    # cannot take the home server down with it.
    mem_limit: 2g
    env_file: ${HOME}/.config/card-game/bots.env
    environment:
      RUST_LOG: info
    # Healthy while Seoul talks to it: the worker rewrites /tmp/alive at
    # every message from the server (a ping every 15 s), and the check
    # fails once it is a minute old (lost, refused as another build, or
    # stuck). deploy/update.sh's `up --wait` waits for this.
    healthcheck:
      test: ["CMD", "server", "--healthcheck", "--worker-alive", "/tmp/alive"]
      interval: 30s
      start_period: 1m
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
