# Bots think on the home server, which dials in to /internal/bots; when it
# is away, bots here think for themselves within --bot-think-ms.
# Runs on the Seoul Lightsail instance (cards-seoul), which serves
# cards.buttercrab.io directly: Korean ISPs reach it in a few ms, where
# Cloudflare's free plan sends them through Los Angeles. The image is built
# on the home server and shipped here by deploy/update.sh.
name: card-game

services:
  cards:
    image: card-game:latest
    container_name: card-game
    # A nano instance earns little sustained CPU; cap bot thinking near what
    # 200 sampled deals take, so long bot games do not drain its burst credit.
    command: ["--bot-think-ms", "150"]
    # The instance is small; cap the server so a runaway leaves room for
    # Caddy and the system. When stopped it saves every table (well within
    # the grace period) and the next start restores them.
    mem_limit: 256m
    memswap_limit: 320m
    stop_grace_period: 20s
    # Secrets live on the instance, next to this file, never in the repository.
    env_file:
      # BOT_TOKEN, the secret the home server's bot worker presents.
      - bots.env
      # Optional: STATS_TOKEN opens /stats; CF_BEACON_TOKEN adds Cloudflare
      # Web Analytics to every page. See README.md, "Stats and analytics".
      - path: site.env
        required: false
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      RUST_LOG: info
    volumes:
      - tables:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    # caddy:2, pinned by digest (2026-10-06); to move it, look up the tag's
    # current one with `docker buildx imagetools inspect caddy:2`.
    image: caddy:2@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    container_name: caddy
    mem_limit: 96m
    memswap_limit: 128m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tables:
  caddy-data:
  caddy-config:
